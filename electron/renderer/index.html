<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com https://github.com https://raw.githubusercontent.com https://*.githubusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>GitHub Repository Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name" data-i18n="appName">GitHub Repository Manager</span>
      </div>
      <div class="titlebar-repo" id="titlebar-repo"></div>
      <div class="titlebar-actions">
        <button id="settings-btn" class="window-btn" title="Settings" data-i18n-title="settings"></button>
        <button id="account-btn" class="account-btn" title="Log in to GitHub" data-i18n-title="loginGithub"></button>
      </div>
      <div class="window-controls">
        <button id="theme-btn" class="window-btn" title="Switch theme" data-i18n-title="switchTheme"></button>
        <button id="window-min" class="window-btn" title="Minimize" data-i18n-title="minimize"></button>
        <button id="window-max" class="window-btn" title="Maximize" data-i18n-title="maximize"></button>
        <button id="window-close" class="window-btn close" title="Close" data-i18n-title="closeWindow"></button>
      </div>
    </header>

    <main class="main-layout">
      <aside class="repos-sidebar">
        <div class="sidebar-head">
          <span class="sidebar-title" data-i18n="repos">Repositories</span>
          <div class="sidebar-actions">
            <button id="create-repo-btn" class="icon-btn" title="New repository" data-i18n-title="newRepo"></button>
            <button id="new-repo-btn" class="icon-btn" title="Refresh cloud repositories" data-i18n-title="refreshCloud"></button>
          </div>
        </div>
        <div class="sidebar-search">
          <span class="search-icon"></span>
          <input id="repo-filter" type="text" spellcheck="false" placeholder="Filter repositories" autocomplete="off" data-i18n-placeholder="filterRepos">
        </div>
        <div id="repo-list" class="repo-list"></div>
        <div class="storage-foot">
          <span class="storage-dot"></span>
          <span id="storage-label" data-i18n="githubLiveCloud">GitHub live cloud</span>
        </div>
      </aside>

      <div class="pane-resizer" data-resizer="sidebar" title="Resize" data-i18n-title="resize"></div>

      <section class="files-panel">
        <div class="files-head">
          <span class="panel-title" data-i18n="files">Files</span>
          <div class="files-actions">
            <button id="new-file-btn" class="icon-btn" title="New file" data-i18n-title="newFile"></button>
            <button id="new-folder-btn" class="icon-btn" title="New folder" data-i18n-title="newFolder"></button>
            <button id="refresh-files-btn" class="icon-btn" title="Refresh" data-i18n-title="refresh"></button>
            <button id="collapse-btn" class="icon-btn" title="Collapse" data-i18n-title="collapse"></button>
          </div>
        </div>
        <div id="cloud-toolbar" class="cloud-toolbar hidden">
          <select id="branch-select" class="branch-select" title="Switch branch" data-i18n-title="switchBranch"></select>
          <button id="download-current-btn" class="icon-btn" title="Download current directory" data-i18n-title="downloadCurrentDir"></button>
          <button id="repo-search-btn" class="icon-btn" title="Search whole repository" data-i18n-title="searchWholeRepo"></button>
        </div>
        <div class="file-search">
          <span class="search-icon"></span>
          <input id="file-search" type="text" spellcheck="false" placeholder="Filter current directory" autocomplete="off" data-i18n-placeholder="filterCurrentDir">
        </div>
        <div id="breadcrumb" class="breadcrumb"></div>
        <div id="files-tree" class="files-tree"></div>
      </section>

      <div class="pane-resizer" data-resizer="files" title="Resize" data-i18n-title="resize"></div>

      <section class="workspace-panel">
        <div id="workspace-empty" class="workspace-empty">
          <div class="empty-hero">
            <span class="empty-mark"></span>
            <h1 data-i18n="emptyTitle">Connect your GitHub repository</h1>
            <p data-i18n="emptyDesc">Manage repositories directly from the cloud without local clones.</p>
          </div>
        </div>
        <div id="workspace-content" class="workspace-content hidden">
          <div class="workspace-toolbar">
            <div id="file-path" class="file-path"></div>
            <div id="workspace-actions" class="workspace-actions"></div>
          </div>
          <div id="workspace-body" class="workspace-body"></div>
        </div>
      </section>

      <div class="pane-resizer" data-resizer="git" title="Resize" data-i18n-title="resize"></div>

      <aside class="git-panel">
        <div class="git-tabs">
          <button class="git-tab active" data-tab="changes" data-i18n="changes">Changes</button>
          <button class="git-tab" data-tab="history" data-i18n="history">History</button>
          <button class="git-tab" data-tab="branches" data-i18n="branches">Branches</button>
          <button class="git-tab" data-tab="remote" data-i18n="remote">Remote</button>
        </div>
        <div id="git-body" class="git-body"></div>
      </aside>
    </main>

    <footer class="statusbar">
      <div class="status-left">
        <span class="status-pulse"></span>
        <span id="status-message" data-i18n="ready">Ready</span>
      </div>
      <div class="status-right">
        <span id="status-repo" data-i18n="noRepo">No repository</span>
        <span class="status-divider"></span>
        <span id="status-count">0 files</span>
      </div>
    </footer>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-message" id="modal-message"></div>
      <div class="modal-field" id="modal-field">
        <input id="modal-input" type="text" spellcheck="false">
        <select id="modal-select" class="modal-select hidden"></select>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost-btn" data-i18n="cancel">Cancel</button>
        <button id="modal-ok" class="primary-btn" data-i18n="ok">OK</button>
      </div>
    </div>
  </div>

  <div id="repo-form-overlay" class="modal-overlay hidden">
    <div class="modal-box repo-form-box">
      <div class="modal-title" data-i18n="newRepo">New repository</div>
      <div class="repo-form">
        <label class="form-label" data-i18n="owner">Owner</label>
        <select id="repo-owner-select" class="repo-field"></select>

        <label class="form-label" data-i18n="repositoryName">Repository name</label>
        <input id="repo-name-input" class="repo-field" type="text" spellcheck="false" placeholder="repository-name">
        <div id="repo-name-hint" class="repo-name-hint"></div>

        <label class="form-label"><span data-i18n="descriptionOptional">Description (optional)</span></label>
        <textarea id="repo-desc-input" class="repo-field repo-textarea" placeholder="Short description" data-i18n-placeholder="shortDescription"></textarea>

        <div class="repo-visibility">
          <label class="repo-radio">
            <input type="radio" name="repo-visibility" value="public" checked>
            <span>
              <strong data-i18n="publicRepo">Public</strong>
              <small data-i18n="publicHint">Anyone on the internet can see this repository.</small>
            </span>
          </label>
          <label class="repo-radio">
            <input type="radio" name="repo-visibility" value="private">
            <span>
              <strong data-i18n="privateRepo">Private</strong>
              <small data-i18n="privateHint">You choose who can see and commit to this repository.</small>
            </span>
          </label>
        </div>

        <div class="repo-init-title" data-i18n="initializeWith">Initialize this repository with:</div>
        <label class="repo-check">
          <input id="repo-readme-input" type="checkbox">
          <span data-i18n="addReadme">Add a README file</span>
        </label>

        <label class="form-label" data-i18n="addGitignore">Add .gitignore</label>
        <select id="repo-gitignore-select" class="repo-field"></select>

        <label class="form-label" data-i18n="chooseLicense">Choose a license</label>
        <select id="repo-license-select" class="repo-field"></select>
      </div>
      <div class="modal-actions">
        <button id="repo-form-cancel" class="ghost-btn" data-i18n="cancel">Cancel</button>
        <button id="repo-form-create" class="primary-btn" disabled data-i18n="createRepository">Create repository</button>
      </div>
    </div>
  </div>

  <div id="settings-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title" data-i18n="settingsTitle">Settings</div>
      <label class="form-label" data-i18n="language">Language</label>
      <select id="language-select" class="repo-field">
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
      <div class="modal-actions">
        <button id="settings-close" class="primary-btn" data-i18n="close">Close</button>
      </div>
    </div>
  </div>

  <div id="context-menu" class="context-menu hidden"></div>
  <div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-card">
      <span id="drop-icon"></span>
      <span data-i18n="dropToImport">Release to import</span>
    </div>
  </div>
  <div id="operation-overlay" class="operation-overlay hidden">
    <div class="operation-card">
      <span class="operation-spinner"></span>
      <span id="operation-message" data-i18n="processing">Processing...</span>
    </div>
  </div>
  <div id="toast-stack" class="toast-stack"></div>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
